<!DOCTYPE html>
<html >
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TASK Website</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
    }

    body{
        font-family:Arial, sans-serif;
        padding:20px;
        text-align: center;
        background-color: grey;
    }

    nav{
        display:flex;
        flex-direction:column;
        align-items:center;
        border-radius:10px;
        background-color:#f2f2f2;
        padding:5px;
        
    }

    nav a{
        text-decoration:none;
        color:black;
        padding:10px;
        font-weight:bold;
    }

    @media (min-width:768px){
        nav{
            flex-direction:row;
            justify-content:center;
            gap:30px;
        }
    }

    h1{
        margin:20px 0;
    }

    img{
        width:250px;
        height:250px;
        object-fit:cover;
        border-radius:50px; 
    }

    video{
        width:50vw;
        padding:15px;
        border-radius:10px;
        background-color:grey;
    }

    table{
        border-collapse:collapse;
        margin-top:20px;
        width:100%;
    }

    th,td{
        border:1px solid black;
        padding:10px;
        text-align:center;
    }
    th{
        background-color:rgb(91, 86, 86);
        

    }

    button{
        border:none;
        padding:12px 20px;
        margin-top:20px;
        cursor:pointer;
        color:rgb(13, 6, 6);

        background-color:rgb(219, 9, 9);
        border-radius: 60px;

        transition:0.3s;
    }

    button:hover{
        opacity:0.8;
        transform:scale(1.05);
    }

    .grid{
        display:grid;
        grid-template-columns:repeat(4,1fr);
        gap:10px;
        margin-top:30px;
    }

    .img{
        background-color:greenyellow;
        padding:20px;
        text-align:center;
        font-size:20px;
    }

    @media (max-width:600px){
        .grid{
            grid-template-columns:repeat(2,1fr);
        }
    }
</style>
</head>
<body>

    
    <nav>
        <a href="https://smashkarts.io/">Home</a>
        <a href="https://netflix.in/">About</a>
        <a href="https://www.xbox.com/en-us/play/">Contact</a>
    </nav>

     
    <h1>Task Website</h1>

    
    <img src="pngwing.com.png" alt="Sample Image">

    <br><br>

    
    <video controls>
        <source src="clock.mp4" type="video/mp4">
    </video>

    
    <table>
        <tr>
            <th>Benny</th>
            <th>muthupandi</th>
            <th>saran</th>
        </tr>
        <tr>
            <td>clg bus</td>
            <td>bike</td>
            <td>bike</td>
        </tr>
        <tr>
            <td>velachery</td>
            <td>chithalapakam</td>
            <td>chengalpattu</td>
        </tr>
    </table>

    
    <button>search</button>

    
    <div class="grid">
        <div class="img">1</div>
        
        <div class="img">2</div>
        <div class="img">3</div>
        <div class="img">4</div>
        <div class="img">5</div>
        <div class="img">6</div>
        <div class="img">7</div>
        <div class="img">8</div>
    </div>

</body>
</html>
